name: mirror
on:
  schedule: [{cron: "17 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          for e in all current milestone nightly release-candidate release-nightly; do
            curl -sSf --retry 3 "https://services.gradle.org/versions/$e" -o "versions/$e.json.new"
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "versions/$e.json.new"
            mv "versions/$e.json.new" "versions/$e.json"
          done
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add versions
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "gradle versions $(date -u +%FT%TZ)"
            git push
          fi
